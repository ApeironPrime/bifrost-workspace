services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost_dev_password
      POSTGRES_DB: bifrost_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - bifrost_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  server:
    build: ./server
    command: sh -c "npx prisma migrate deploy && npm start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - turn_shared_secret
    environment:
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: docker_development_only_change_before_production
      DATABASE_URL: postgresql://bifrost:bifrost_dev_password@postgres:5432/bifrost_db?schema=public
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:-docker_dev_hmac_secret_change_me}
      AVATAR_STORAGE_DIR: /data/avatars
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp}
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-900}
    volumes:
      - bifrost_avatar_data:/data/avatars
    ports:
      - "3000:3000"

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "5173:80"

  # TURN is a WebRTC relay fallback for restrictive NAT/firewall environments.
  # It relays encrypted peer-to-peer packets; it does not receive Socket.IO,
  # REST, chat, note, whiteboard, or file application payloads.
  turn:
    image: coturn/coturn:4.6.3
    secrets:
      - turn_shared_secret
    tmpfs:
      - /run/coturn:rw,noexec,nosuid,size=4m,mode=1777
    volumes:
      - ./docker/coturn-entrypoint.sh:/usr/local/bin/coturn-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/coturn-entrypoint.sh"]
    environment:
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_REALM: ${TURN_REALM:-bifrost.local}
      TURN_NETWORK_PROFILE: ${TURN_NETWORK_PROFILE:-local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/tcp"
      - "49160-49200:49160-49200/udp"

secrets:
  turn_shared_secret:
    file: ./secrets/turn_shared_secret

volumes:
  bifrost_postgres_data:
  bifrost_avatar_data:
